[package]
name = "rustris-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
strum = "0.28.0"
strum_macros = "0.28.0"
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_winit",          
    "bevy_render",         
    "bevy_core_pipeline",  
    "bevy_sprite",         
    "x11",                 
    "tonemapping_luts",
    "bevy_asset",
    "zstd_rust",
    "bevy_sprite_render",
    "bevy_text"
    ]}
blob = "0.3.0"
linebender_resource_handle = "0.1.1"

[profile.release]
opt-level = "s"     
lto = true          
codegen-units = 1   
panic = "abort"     
strip = true        
